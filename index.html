<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Solver AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1f2937, #020617);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
    }

    .card {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    h1 { margin: 0; font-size: 32px; letter-spacing: -0.04em; }
    .subtitle { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }

    textarea {
      width: 100%;
      height: 160px;
      resize: none;
      border: 1px solid rgba(148, 163, 184, 0.22);
      outline: none;
      border-radius: 18px;
      padding: 18px;
      background: #020617;
      color: #e5e7eb;
      font-size: 16px;
      line-height: 1.6;
    }
    textarea:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }

    .upload-row { display: flex; gap: 12px; margin-top: 14px; }
    .upload-box {
      flex: 1;
      border: 1px dashed rgba(148, 163, 184, 0.45);
      border-radius: 16px;
      padding: 14px;
      color: #cbd5e1;
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .upload-box:hover { border-color: #38bdf8; color: #38bdf8; background: rgba(56,189,248,0.06); }
    .upload-box.loading { border-color: #38bdf8; color: #38bdf8; }
    .upload-box.done { border-color: #4ade80; color: #4ade80; border-style: solid; }
    .upload-box.error { border-color: #f87171; color: #f87171; border-style: solid; }
    input[type="file"] { display: none; }

    .buttons { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .primary { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #020617; }
    .secondary { background: rgba(148,163,184,0.14); color: #e2e8f0; border: 1px solid rgba(148,163,184,0.2); }
    button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }

    /* 인증 바 */
    .auth-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .auth-btn {
      background: none;
      border: 1px solid rgba(148,163,184,0.3);
      border-radius: 999px;
      padding: 6px 14px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .auth-btn:hover {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(56,189,248,0.08);
      transform: none;
      filter: none;
    }
    .auth-btn.logout {
      color: #f87171;
      border-color: rgba(248,113,113,0.3);
    }
    .auth-btn.logout:hover {
      color: #f87171;
      border-color: #f87171;
      background: rgba(248,113,113,0.08);
    }
    .auth-username {
      color: #4ade80;
      font-size: 13px;
      font-weight: 600;
    }

    /* 인증 모달 */
    .auth-tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(148,163,184,0.2);
    }
    .auth-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 24px;
      color: #64748b;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      border-radius: 0;
      margin-bottom: -1px;
    }
    .auth-tab.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    .auth-tab:hover { color: #94a3b8; transform: none; filter: none; }
    .auth-input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 12px;
      background: #020617;
      color: #e5e7eb;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      display: block;
    }
    .auth-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
    .auth-error { color: #f87171; font-size: 13px; margin: 0 0 12px; display: none; }

    /* 기록 */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      padding: 12px 0 8px;
      margin-top: 4px;
      border-top: 1px solid rgba(148,163,184,0.12);
      user-select: none;
    }
    .history-header:hover { color: #94a3b8; }
    .history-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(2,6,23,0.5);
      border: 1px solid rgba(148,163,184,0.1);
      cursor: pointer;
      font-size: 13px;
      transition: 0.15s;
    }
    .history-item:hover { border-color: rgba(56,189,248,0.4); background: rgba(56,189,248,0.05); }
    .history-problem { color: #cbd5e1; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-answer { color: #4ade80; font-weight: 700; white-space: nowrap; font-size: 12px; }
    .history-type { color: #818cf8; font-size: 11px; white-space: nowrap; }

    /* 결과 영역 */
    .result-area { display: flex; flex-direction: column; gap: 16px; }
    .section {
      background: rgba(2, 6, 23, 0.68);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      padding: 18px;
      animation: fadeIn 0.25s ease;
    }
    .section h3 { margin: 0 0 10px; font-size: 17px; color: #7dd3fc; }
    .section p, .section li { color: #dbeafe; line-height: 1.65; margin: 6px 0; }
    ol { padding-left: 22px; margin: 0; }
    .empty { color: #64748b; text-align: center; padding: 80px 20px; line-height: 1.7; }
    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(34,197,94,0.14);
      color: #86efac;
      font-size: 13px;
      font-weight: 700;
    }
    .hint { border-color: rgba(251,191,36,0.35); }
    .hint h3 { color: #facc15; }
    .tip { border-color: rgba(167,139,250,0.35); background: rgba(167,139,250,0.06); }
    .tip h3 { color: #c4b5fd; }

    /* 복사 버튼 */
    .copy-btn {
      background: rgba(148,163,184,0.12);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 999px;
      padding: 4px 12px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 10px;
      transition: 0.2s;
      vertical-align: middle;
    }
    .copy-btn:hover { background: rgba(56,189,248,0.15); color: #38bdf8; border-color: #38bdf8; transform: none; filter: none; }

    /* 이미지 미리보기 */
    .image-preview { margin-top: 10px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(148,163,184,0.2); display: none; }
    .image-preview img { width: 100%; max-height: 180px; object-fit: contain; background: #020617; }

    /* 로딩 */
    .loading-dots::after { content: ''; animation: dots 1.2s steps(4, end) infinite; }
    @keyframes dots {
      0%   { content: ''; }   25%  { content: '.'; }
      50%  { content: '..'; } 75%  { content: '...'; }
      100% { content: ''; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 단계 애니메이션 */
    .step-item { opacity: 0; transform: translateY(10px); transition: opacity 0.4s ease, transform 0.4s ease; }
    .step-item.visible { opacity: 1; transform: translateY(0); }
    .solution-block p { line-height: 1.8; color: #dbeafe; }
    .solution-block h1, .solution-block h2, .solution-block h3 { color: #7dd3fc; margin: 14px 0 6px; }
    .solution-block strong { color: #f0f9ff; }

    /* 모달 공통 */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      animation: fadeIn 0.2s ease;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 24px;
      padding: 36px 32px 32px;
      max-width: 720px; width: 100%;
      max-height: 82vh; overflow-y: auto;
      position: relative;
    }
    .modal-box h2 { margin: 0 0 20px; font-size: 20px; color: #7dd3fc; }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(148,163,184,0.14);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 999px; padding: 5px 13px;
      color: #e2e8f0; cursor: pointer; font-size: 15px;
    }
    .modal-close:hover { background: rgba(148,163,184,0.25); transform: none; filter: none; }

    @media (max-width: 850px) {
      body { padding: 18px; align-items: flex-start; }
      .app { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <!-- 헤더: 타이틀 + 인증 바 -->
      <div class="card-header">
        <h1>Math Solver AI</h1>
        <div class="auth-bar" id="authBar">
          <!-- 비로그인 상태 -->
          <div id="authGuest">
            <button class="auth-btn" onclick="showAuthModal('login')">로그인</button>
            <button class="auth-btn" onclick="showAuthModal('register')">회원가입</button>
          </div>
          <!-- 로그인 상태 -->
          <div id="authUser" style="display:none; align-items:center; gap:8px;">
            <span class="auth-username" id="authUsername"></span>
            <button class="auth-btn logout" onclick="handleLogout()">로그아웃</button>
          </div>
        </div>
      </div>
      <p class="subtitle">수학 문제를 입력하거나 이미지를 업로드하면 단계별로 풀이해드립니다.</p>

      <textarea id="problemInput" placeholder="예: x² - 5x + 6 = 0 풀어줘&#10;예: x³ + 2x 미분해줘&#10;예: x² - 4 인수분해해줘" maxlength="2000"></textarea>

      <div class="image-preview" id="imagePreview">
        <img id="previewImg" src="" alt="업로드된 이미지" />
      </div>

      <div class="upload-row">
        <label class="upload-box" id="imageLabel" for="imageInput">
          📷 이미지 업로드
          <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" />
        </label>
        <label class="upload-box" id="pdfLabel" for="pdfInput">
          📄 PDF 업로드
          <input type="file" id="pdfInput" accept=".pdf" onchange="handlePdfUpload(event)" />
        </label>
      </div>

      <div class="buttons">
        <button class="primary" id="solveBtn" onclick="solveProblem()">문제 풀기</button>
        <button class="secondary" id="hintBtn" onclick="showHint()">힌트 보기</button>
        <button class="secondary" onclick="resetApp()">초기화</button>
      </div>

      <!-- 풀이 기록 -->
      <div class="history-header" id="historyHeader" style="display:none;" onclick="toggleHistory()">
        <span id="historyHeaderText">최근 풀이 기록</span>
        <span id="historyArrow">▼</span>
      </div>
      <div class="history-list" id="historyList" style="display:none;"></div>
    </section>

    <!-- 풀이 모달 -->
    <div id="solutionModal" class="modal-overlay" style="display:none;" onclick="closeSolutionModal(event)">
      <div class="modal-box">
        <button class="modal-close" onclick="closeSolutionModal()">✕ 닫기</button>
        <h2>풀이 과정</h2>
        <div id="modalStepsArea"></div>
      </div>
    </div>

    <!-- 인증 모달 -->
    <div id="authModal" class="modal-overlay" style="display:none;" onclick="closeAuthModal(event)">
      <div class="modal-box" style="max-width:420px;">
        <button class="modal-close" onclick="closeAuthModal()">✕</button>
        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTab" onclick="switchAuthTab('login')">로그인</button>
          <button class="auth-tab" id="registerTab" onclick="switchAuthTab('register')">회원가입</button>
        </div>
        <input type="text" id="authUsernameInput" placeholder="아이디 (3자 이상)" class="auth-input" onkeydown="if(event.key==='Enter') handleAuth()" />
        <input type="password" id="authPasswordInput" placeholder="비밀번호 (6자 이상)" class="auth-input" onkeydown="if(event.key==='Enter') handleAuth()" />
        <p class="auth-error" id="authError"></p>
        <button class="primary" style="width:100%;" onclick="handleAuth()" id="authSubmitBtn">로그인</button>
      </div>
    </div>

    <section class="card result-area" id="resultArea">
      <div class="empty">
        아직 풀이 결과가 없습니다.<br />
        왼쪽에 문제를 입력하고 "문제 풀기"를 눌러보세요.
      </div>
    </section>
  </main>

  <script>
    const API = "https://web-production-e70fe.up.railway.app";

    marked.use({
      extensions: [{ name: 'del', level: 'inline', tokenizer() { return; } }]
    });

    let currentSolution = "";
    let currentAnswer = "";
    let hintIndex = 0;
    let currentAuthTab = "login";
    let authToken = localStorage.getItem("authToken") || null;
    let authUser = localStorage.getItem("authUser") || null;
    let serverHistory = [];

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeSolutionModal();
        closeAuthModal();
      }
    });

    // ── 인증 UI ───────────────────────────────────────────────
    function updateAuthUI() {
      if (authToken && authUser) {
        document.getElementById("authGuest").style.display = "none";
        document.getElementById("authUser").style.display = "flex";
        document.getElementById("authUsername").textContent = authUser + "님";
        document.getElementById("historyHeaderText").textContent = "내 풀이 기록";
        loadServerHistory();
      } else {
        document.getElementById("authGuest").style.display = "flex";
        document.getElementById("authUser").style.display = "none";
        document.getElementById("historyHeaderText").textContent = "최근 풀이 기록";
        renderLocalHistory();
      }
    }

    function showAuthModal(tab) {
      currentAuthTab = tab;
      document.getElementById("authModal").style.display = "flex";
      switchAuthTab(tab);
      document.getElementById("authError").style.display = "none";
      document.getElementById("authUsernameInput").value = "";
      document.getElementById("authPasswordInput").value = "";
      setTimeout(() => document.getElementById("authUsernameInput").focus(), 100);
    }

    function closeAuthModal(event) {
      if (event && event.target !== document.getElementById("authModal")) return;
      document.getElementById("authModal").style.display = "none";
    }

    function switchAuthTab(tab) {
      currentAuthTab = tab;
      document.getElementById("loginTab").className = "auth-tab" + (tab === "login" ? " active" : "");
      document.getElementById("registerTab").className = "auth-tab" + (tab === "register" ? " active" : "");
      document.getElementById("authSubmitBtn").textContent = tab === "login" ? "로그인" : "회원가입";
      document.getElementById("authError").style.display = "none";
    }

    async function handleAuth() {
      const username = document.getElementById("authUsernameInput").value.trim();
      const password = document.getElementById("authPasswordInput").value;
      const errorEl = document.getElementById("authError");
      const btn = document.getElementById("authSubmitBtn");

      if (!username || !password) {
        errorEl.textContent = "아이디와 비밀번호를 입력해주세요.";
        errorEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      const endpoint = currentAuthTab === "login" ? "/login" : "/register";

      try {
        const resp = await fetch(API + endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json();

        if (data.success) {
          authToken = data.token;
          authUser = data.username;
          localStorage.setItem("authToken", authToken);
          localStorage.setItem("authUser", authUser);
          document.getElementById("authModal").style.display = "none";
          updateAuthUI();
        } else {
          errorEl.textContent = data.error;
          errorEl.style.display = "block";
        }
      } catch {
        errorEl.textContent = "서버에 연결할 수 없습니다.";
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    }

    function handleLogout() {
      authToken = null;
      authUser = null;
      localStorage.removeItem("authToken");
      localStorage.removeItem("authUser");
      serverHistory = [];
      updateAuthUI();
    }

    // ── 서버 기록 ────────────────────────────────────────────
    async function loadServerHistory() {
      if (!authToken) return;
      try {
        const resp = await fetch(API + "/history", {
          headers: { "Authorization": "Bearer " + authToken }
        });
        const data = await resp.json();
        if (data.success) {
          serverHistory = data.history;
          renderServerHistory();
        }
      } catch {}
    }

    function renderServerHistory() {
      const header = document.getElementById("historyHeader");
      const list = document.getElementById("historyList");
      if (serverHistory.length === 0) { header.style.display = "none"; return; }

      header.style.display = "flex";
      list.innerHTML = serverHistory.map((item, i) => `
        <div class="history-item" onclick="loadServerHistoryItem(${i})">
          <span class="history-type">${escapeHTML(item.problem_type || "")}</span>
          <span class="history-problem">${escapeHTML(item.problem.length > 35 ? item.problem.slice(0, 35) + "…" : item.problem)}</span>
          <span class="history-answer">${escapeHTML(item.answer || "")}</span>
        </div>
      `).join("");
    }

    function loadServerHistoryItem(index) {
      if (serverHistory[index]) {
        document.getElementById("problemInput").value = serverHistory[index].problem;
      }
    }

    async function saveToServer(problem, answer, problemType) {
      if (!authToken) return;
      try {
        await fetch(API + "/history/save", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + authToken
          },
          body: JSON.stringify({ problem, answer: answer || "", problem_type: problemType || "" })
        });
        await loadServerHistory();
      } catch {}
    }

    // ── 이미지 업로드 ──────────────────────────────────────────
    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const label = document.getElementById("imageLabel");
      const preview = document.getElementById("imagePreview");
      const previewImg = document.getElementById("previewImg");

      previewImg.src = URL.createObjectURL(file);
      preview.style.display = "block";
      label.className = "upload-box loading";
      label.childNodes[0].textContent = "⏳ 문제 인식 중";

      try {
        const formData = new FormData();
        formData.append("file", file);
        const resp = await fetch(API + "/extract-image", { method: "POST", body: formData });
        const data = await resp.json();

        if (data.success) {
          document.getElementById("problemInput").value = data.problem;
          label.className = "upload-box done";
          label.childNodes[0].textContent = "✓ 인식 완료";
        } else {
          label.className = "upload-box error";
          label.childNodes[0].textContent = "✗ 인식 실패";
          alert(data.error);
        }
      } catch {
        label.className = "upload-box error";
        label.childNodes[0].textContent = "✗ 서버 오류";
        alert("서버에 연결할 수 없습니다.");
      }
      event.target.value = "";
    }

    // ── PDF 업로드 ──────────────────────────────────────────────
    async function handlePdfUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const label = document.getElementById("pdfLabel");
      label.className = "upload-box loading";
      label.childNodes[0].textContent = "⏳ 문제 인식 중";

      try {
        const formData = new FormData();
        formData.append("file", file);
        const resp = await fetch(API + "/extract-pdf", { method: "POST", body: formData });
        const data = await resp.json();

        if (data.success) {
          document.getElementById("problemInput").value = data.problem;
          label.className = "upload-box done";
          label.childNodes[0].textContent = "✓ 인식 완료";
        } else {
          label.className = "upload-box error";
          label.childNodes[0].textContent = "✗ 인식 실패";
          alert(data.error);
        }
      } catch {
        label.className = "upload-box error";
        label.childNodes[0].textContent = "✗ 서버 오류";
        alert("서버에 연결할 수 없습니다.");
      }
      event.target.value = "";
    }

    // ── 문제 풀기 ────────────────────────────────────────────────
    async function solveProblem() {
      const problem = document.getElementById("problemInput").value.trim();
      const resultArea = document.getElementById("resultArea");
      const btn = document.getElementById("solveBtn");

      if (!problem) { alert("문제를 먼저 입력해주세요."); return; }

      btn.disabled = true;
      hintIndex = 0;
      resultArea.innerHTML = `
        <div class="section">
          <h3>계산 중<span class="loading-dots"></span></h3>
          <p>Claude가 풀이를 생성하고 있습니다...</p>
        </div>`;

      try {
        const headers = { "Content-Type": "application/json" };
        if (authToken) headers["Authorization"] = "Bearer " + authToken;

        const response = await fetch(API + "/solve", {
          method: "POST",
          headers,
          body: JSON.stringify({ problem })
        });
        const data = await response.json();

        if (!data.success) {
          resultArea.innerHTML = `<div class="section"><h3>오류</h3><p>${escapeHTML(data.error)}</p></div>`;
          return;
        }

        currentSolution = data.solution || "";
        currentAnswer = data.answer || "";

        resultArea.innerHTML = `
          <div class="section">
            <h3>문제 분석</h3>
            <p><strong>문제 유형:</strong> ${escapeHTML(data.problem_type)}</p>
            <p><strong>해석된 식:</strong> ${escapeHTML(data.parsed_expression)}</p>
          </div>
          <div class="section">
            <h3>정답</h3>
            <p>
              <strong id="answerText">${escapeHTML(data.answer)}</strong>
              <button class="copy-btn" id="copyBtn" onclick="copyAnswer()">복사</button>
            </p>
            <span class="badge">${data.verified ? "✓ 검증 완료" : "검증 실패"}</span>
          </div>
          ${data.explanation ? `<div class="section tip"><h3>핵심 개념</h3><p id="explanationText"></p></div>` : ""}
          ${currentSolution ? `<button class="primary" style="width:100%; margin-top:4px;" onclick="showSteps()">풀이 확인하기</button>` : ""}
        `;

        if (data.explanation) {
          const expEl = document.getElementById("explanationText");
          expEl.innerHTML = marked.parseInline(data.explanation);
          renderLatex(expEl);
        }

        saveHistory(problem, data.answer, data.problem_type);

      } catch {
        resultArea.innerHTML = `
          <div class="section">
            <h3>서버 연결 실패</h3>
            <p>잠시 후 다시 시도해주세요.</p>
          </div>`;
      } finally {
        btn.disabled = false;
      }
    }

    // ── 정답 복사 ────────────────────────────────────────────────
    function copyAnswer() {
      navigator.clipboard.writeText(currentAnswer).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.textContent = "✓ 복사됨";
        btn.style.color = "#4ade80";
        setTimeout(() => { btn.textContent = "복사"; btn.style.color = ""; }, 1500);
      }).catch(() => alert("복사에 실패했습니다."));
    }

    // ── LaTeX 렌더링 ─────────────────────────────────────────────
    function renderLatex(el) {
      if (typeof renderMathInElement === "undefined") return;
      renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$",  right: "$",  display: false }
        ],
        throwOnError: false
      });
    }

    function protectMath(text) {
      const blocks = [];
      text = text.replace(/\$\$([\s\S]*?)\$\$/g, (m) => { blocks.push(m); return `\x00MATH${blocks.length-1}\x00`; });
      text = text.replace(/\$([^$\n]+?)\$/g,      (m) => { blocks.push(m); return `\x00MATH${blocks.length-1}\x00`; });
      return { text, blocks };
    }
    function restoreMath(html, blocks) {
      return html.replace(/\x00MATH(\d+)\x00/g, (_, i) => blocks[+i]);
    }

    // ── 풀이 모달 ────────────────────────────────────────────────
    function showSteps() {
      if (!currentSolution) return;

      const modal = document.getElementById("solutionModal");
      const stepsArea = document.getElementById("modalStepsArea");
      stepsArea.innerHTML = "";
      modal.style.display = "flex";

      const { text: safe, blocks: mathBlocks } = protectMath(currentSolution);
      const html = restoreMath(marked.parse(safe), mathBlocks);

      const wrapper = document.createElement("div");
      wrapper.innerHTML = html;
      const children = Array.from(wrapper.childNodes).filter(
        n => n.nodeType === 1 || (n.nodeType === 3 && n.textContent.trim())
      );

      const sections = [];
      let current = [];
      children.forEach(node => {
        const tag = node.tagName || "";
        if ((tag === "H1" || tag === "H2" || tag === "H3") && current.length > 0) {
          sections.push(current); current = [node];
        } else { current.push(node); }
      });
      if (current.length > 0) sections.push(current);

      sections.forEach((nodes, i) => {
        setTimeout(() => {
          const div = document.createElement("div");
          div.className = "section step-item solution-block";
          nodes.forEach(n => div.appendChild(n.cloneNode(true)));
          stepsArea.appendChild(div);
          requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add("visible")));
          renderLatex(div);
        }, i * 600);
      });
    }

    function closeSolutionModal(event) {
      if (event && event.target !== document.getElementById("solutionModal")) return;
      document.getElementById("solutionModal").style.display = "none";
    }

    // ── 힌트 ─────────────────────────────────────────────────────
    async function showHint() {
      const problem = document.getElementById("problemInput").value.trim();
      if (!problem) { alert("문제를 먼저 입력해주세요."); return; }

      const resultArea = document.getElementById("resultArea");
      const btn = document.getElementById("hintBtn");
      btn.disabled = true;
      hintIndex++;

      const hintBox = document.createElement("div");
      hintBox.className = "section hint";
      hintBox.innerHTML = `<h3>힌트 ${hintIndex} <span class="loading-dots"></span></h3>`;
      resultArea.appendChild(hintBox);
      resultArea.scrollTop = resultArea.scrollHeight;

      try {
        const resp = await fetch(API + "/hint", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ problem })
        });
        const data = await resp.json();
        hintBox.innerHTML = `<h3>힌트 ${hintIndex}</h3><p>${escapeHTML(data.hint)}</p>`;
      } catch {
        hintBox.innerHTML = `<h3>힌트 ${hintIndex}</h3><p>힌트를 불러올 수 없습니다.</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    // ── 풀이 기록 ────────────────────────────────────────────────
    function saveHistory(problem, answer, problemType) {
      // 로컬 저장
      const history = JSON.parse(localStorage.getItem("mathHistory") || "[]");
      history.unshift({ problem, answer, problemType });
      if (history.length > 8) history.pop();
      localStorage.setItem("mathHistory", JSON.stringify(history));

      // 로그인 상태면 서버에도 저장
      if (authToken) {
        saveToServer(problem, answer, problemType);
      } else {
        renderLocalHistory();
      }
    }

    function renderLocalHistory() {
      const history = JSON.parse(localStorage.getItem("mathHistory") || "[]");
      const header = document.getElementById("historyHeader");
      const list = document.getElementById("historyList");
      if (history.length === 0) { header.style.display = "none"; return; }

      header.style.display = "flex";
      list.innerHTML = history.map((item, i) => `
        <div class="history-item" onclick="loadLocalHistory(${i})">
          <span class="history-type">${escapeHTML(item.problemType || "")}</span>
          <span class="history-problem">${escapeHTML(item.problem.length > 35 ? item.problem.slice(0, 35) + "…" : item.problem)}</span>
          <span class="history-answer">${escapeHTML(item.answer)}</span>
        </div>
      `).join("");
    }

    function loadLocalHistory(index) {
      const history = JSON.parse(localStorage.getItem("mathHistory") || "[]");
      if (history[index]) {
        document.getElementById("problemInput").value = history[index].problem;
      }
    }

    function toggleHistory() {
      const list = document.getElementById("historyList");
      const arrow = document.getElementById("historyArrow");
      const isOpen = list.style.display !== "none";
      list.style.display = isOpen ? "none" : "flex";
      arrow.textContent = isOpen ? "▼" : "▲";
    }

    // ── 초기화 ───────────────────────────────────────────────────
    function resetApp() {
      document.getElementById("problemInput").value = "";
      document.getElementById("imagePreview").style.display = "none";
      document.getElementById("previewImg").src = "";
      const imageLabel = document.getElementById("imageLabel");
      imageLabel.className = "upload-box";
      imageLabel.childNodes[0].textContent = "📷 이미지 업로드";
      const pdfLabel = document.getElementById("pdfLabel");
      pdfLabel.className = "upload-box";
      pdfLabel.childNodes[0].textContent = "📄 PDF 업로드";
      hintIndex = 0;
      currentSolution = "";
      currentAnswer = "";
      document.getElementById("resultArea").innerHTML = `
        <div class="empty">
          아직 풀이 결과가 없습니다.<br />
          왼쪽에 문제를 입력하고 "문제 풀기"를 눌러보세요.
        </div>`;
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;").replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // 페이지 로드 시 인증 상태 초기화
    updateAuthUI();
  </script>
</body>
</html>
